[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchos-tect-acoustics"
version = "0.1.0"
description = "Reproducible acoustic communication and sensing experiment workspace"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
researchos-acoustics = "researchos_acoustics.cli:main"

[tool.setuptools.packages.find]
include = ["researchos_acoustics*"]
